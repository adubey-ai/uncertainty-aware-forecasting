[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ua-forecast"
version = "0.2.0"
description = "Uncertainty-aware forecasting for non-stationary time series"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "torch>=2.0",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
  "tqdm>=4.65",
  "pyarrow>=14.0",
]

[project.optional-dependencies]
finance = [
  "arch>=6.0",
  "yfinance>=0.2.40",
]
dev = [
  "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
